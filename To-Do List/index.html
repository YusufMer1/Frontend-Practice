<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.2.0/css/all.css">
	<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container p-3">
        <h2 class="app-title">To-Do List</h2>
        <div class="card">
            <div class="card-header">
                New Task
            </div>
            <div class="card-body">
                <form id="addTaskForm">
                    <div class="input-group mb-3">
                        <input type="text" id="taskName" placeholder="Type a new task">
                        <div class="input-group-append">
                            <button class="btn btn-danger" id="btnAddNewTask">
                                <i class="fas fa-plus"></i>
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="card mt-3">
            <div class="card-header">
                Task List
                <a href="#" id="btnDeleteAll" class="btn btn-outline-primary btn-sm delete-all float-right" >Delete All</a>
            </div>
            <ul id="task-list" class="list-group">

            </ul>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
